<!doctype html>
<html lang="en">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>UI detail checks</title>
  <style>
  body {
    margin: 20px;
    font: 14px / 1.5 system-ui;
    color: #1a1a1a;
    background: #e5e7eb;
  }
  iframe {
    display: block;
    border: 0;
    max-width: 100%;
    background: white;
  }
  pre {
    white-space: pre-wrap;
  }
  button,
  select {
    min-height: 44px;
    margin: 4px;
    font: inherit;
  }
  </style>
  <h1>UI detail checks</h1>
  <p>
    Isolated layout checks use the real page markup and stylesheet. No desktop connection, native touch, or phone IME.
  </p>
  <label
    >Appearance
    <select id="theme">
      <option>dark</option>
      <option>light</option>
    </select></label
  >
  <label
    >Width
    <select id="width">
      <option>390</option>
      <option>320</option>
      <option>1024</option>
    </select></label
  >
  <label
    >View
    <select id="view">
      <option>detail</option>
      <option>list</option>
      <option>login</option>
    </select></label
  >
  <button id="menu" type="button">Toggle menu</button>
  <iframe id="preview" title="Isolated UI preview" width="390" height="760"></iframe>
  <pre id="focus-state">Use Tab inside the preview to check the keyboard focus outline.</pre>
  <pre id="results">Running…</pre>
  <script type="module">
  import { appendAppearanceControl } from "/dist/appearance.js"
  import { TerminalInput } from "/dist/input.js"
  import { KeyToolbar } from "/dist/key-toolbar.js"
  import { NewTerminalMenu } from "/dist/new-terminal.js"
  import { renderSessionList } from "/dist/session-list.js"
  import { renderWorkspaceTree } from "/dist/workspace-tree.js"

  const preview = document.querySelector("#preview")
  const results = document.querySelector("#results")
  const source = new DOMParser().parseFromString(await (await fetch("/?clean=1")).text(), "text/html")
  for (const node of source.querySelectorAll("script")) node.remove()
  source.querySelector("head").prepend(Object.assign(document.createElement("base"), { href: `${location.origin}/` }))
  const loaded = new Promise((resolve) => preview.addEventListener("load", resolve, { once: true }))
  preview.srcdoc = `<!doctype html>${source.documentElement.outerHTML}`
  await loaded
  const doc = preview.contentDocument
  const style = (element, pseudo) => preview.contentWindow.getComputedStyle(element, pseudo)
  const el = (id) => doc.getElementById(id)
  const frame = () => new Promise((resolve) => requestAnimationFrame(() => requestAnimationFrame(resolve)))
  const panes = ["working", "working", "working", "blocked", "done"].map((status, index) => ({
    pane_id: `p${index}`,
    agent_status: status,
    agent: "assistant",
    title: "Reviewing a very long project name",
    cwd: "/workspace/projects/a-long-project-name",
    terminal_title_stripped: "",
  }))
  renderSessionList(el("session-list"), { snapshot: { panes }, selectedPaneId: "p1", onPick() {} })
  const input = new TerminalInput(el("command-input"), el("terminal"), { sendText() {}, sendKeys() {} })
  input.setEnabled(true)
  new KeyToolbar(
    el("key-chips"),
    el("extra-keys"),
    el("input-mode"),
    input,
    el("command-input"),
    el("terminal"),
    () => {},
  ).setEnabled(true)
  for (const id of ["action-menu", "list-menu", "tab-menu"]) {
    el(id).innerHTML =
      `<button class="popover-item"><span class="popover-glyph">✓</span><span class="popover-text"><span class="popover-label">Wrap to Phone</span><span class="popover-hint">Keep normal-size text on a narrow screen</span></span></button><button class="popover-item" disabled><span class="popover-text"><span class="popover-label">Restart &amp; Continue</span><span class="popover-hint">No resumable session</span></span></button><div class="popover-sep"></div>`
    appendAppearanceControl(el(id))
  }
  el("detail-status").textContent = "working"
  el("detail-title").textContent = "A long terminal title that must fit in the header"
  el("remote-banner").textContent = "Encrypted session with an isolated preview desktop"
  el("remote-banner").classList.remove("hidden")
  function show(theme, width, view) {
    doc.documentElement.dataset.theme = theme
    preview.width = width
    el("screen-startup").classList.add("hidden")
    el("screen-login").classList.toggle("hidden", view !== "login")
    el("app").classList.toggle("hidden", view === "login")
    el("screen-list").classList.toggle("hidden", view !== "list")
    el("screen-detail").classList.toggle("hidden", view !== "detail")
    for (const id of ["action-menu", "list-menu", "tab-menu"]) el(id).classList.add("hidden")
  }
  async function checkFitModes() {
    const fitPreview = document.createElement("iframe")
    fitPreview.id = "fit-preview"
    fitPreview.title = "Real Detail fit mode checks"
    fitPreview.height = "760"
    fitPreview.style.maxWidth = "none"
    results.before(fitPreview)
    async function setup() {
      const { DetailScreen } = await import("/dist/detail.js")
      const { TerminalView } = await import("/dist/terminal.js")
      for (const id of ["screen-startup", "screen-login", "screen-list"])
        document.getElementById(id).classList.add("hidden")
      for (const id of ["app", "screen-detail"]) document.getElementById(id).classList.remove("hidden")
      const terminal = new TerminalView(document.getElementById("terminal"))
      const modes = []
      const pane = {
        pane_id: "fixture-pane",
        tab_id: "fixture-tab",
        workspace_id: "fixture-workspace",
        agent: null,
        agent_session: null,
        agent_status: "working",
        title: "Isolated pane",
        terminal_title_stripped: "",
      }
      const snapshot = {
        panes: [pane],
        tabs: [{ tab_id: pane.tab_id, workspace_id: pane.workspace_id, label: "Fixture" }],
        workspaces: [{ workspace_id: pane.workspace_id, label: "Fixture" }],
      }
      const detail = new DetailScreen({
        setFitMode(mode) {
          modes.push(mode)
          terminal.setMode(mode)
        },
        paneSize: () => terminal.size(),
        pickPane() {},
        sendText: async () => {},
        sendKeys: async () => {},
        restartAgent: async () => {},
        toggleTree() {},
        back() {},
        status() {},
      })
      detail.update(snapshot, pane)
      await terminal.kernel.load()
      window.fitFixture = { terminal, detail, modes, pane, snapshot }
    }
    async function load() {
      const loaded = new Promise((resolve) => fitPreview.addEventListener("load", resolve, { once: true }))
      const markup = source.cloneNode(true)
      const script = markup.createElement("script")
      script.type = "module"
      const ready = new Promise((resolve) => {
        const receive = (event) => {
          if (event.source !== fitPreview.contentWindow || event.data !== "detail-fit-ready") return
          window.removeEventListener("message", receive)
          resolve()
        }
        window.addEventListener("message", receive)
      })
      script.textContent = `(${setup.toString()})().then(() => parent.postMessage("detail-fit-ready", parent.location.origin))`
      markup.body.append(script)
      fitPreview.srcdoc = `<!doctype html>${markup.documentElement.outerHTML}`
      await loaded
      await ready
      check(Boolean(fitPreview.contentWindow.fitFixture), "Real Detail fixture loads without a desktop connection")
    }
    fitPreview.width = "1440"
    await load()
    const labels = { wrap: "Wrap to Phone", original: "Original Width", shrink: "Shrink to Fit" }
    const evidence = []
    for (const width of [320, 390, 768, 1024, 1440]) {
      fitPreview.width = String(width)
      await frame()
      const child = fitPreview.contentWindow
      const childDoc = fitPreview.contentDocument
      const { terminal, detail, snapshot, pane, modes } = child.fitFixture
      const menu = childDoc.getElementById("action-menu")
      const more = childDoc.getElementById("detail-more")
      const host = childDoc.getElementById("terminal-view")
      for (const cols of [20, 70, 240]) {
        await terminal.setContent("X".repeat(cols), 39)
        for (const mode of ["wrap", "original", "shrink"]) {
          const prefix = `${width}px ${cols} cols ${mode}: `
          more.click()
          const item = [...menu.querySelectorAll("button")].find(
            (button) => button.querySelector(".popover-label")?.textContent === labels[mode],
          )
          const bounds = item.getBoundingClientRect()
          const hit = childDoc.elementFromPoint(bounds.x + bounds.width / 2, bounds.y + bounds.height / 2)
          check(item.contains(hit), `${prefix}menu item receives pointer hits`)
          item.dispatchEvent(new child.MouseEvent("mousedown", { bubbles: true }))
          for (let poll = 0; poll < 3; poll += 1) detail.update(snapshot, pane)
          check(item.isConnected, `${prefix}polling preserves the pressed item`)
          item.dispatchEvent(new child.MouseEvent("mouseup", { bubbles: true }))
          item.click()
          check(
            menu.classList.contains("hidden") && modes.at(-1) === mode && terminal.mode === mode,
            `${prefix}click applies mode and closes menu`,
          )
          more.click()
          const checked = [...menu.querySelectorAll("button")].filter((button) =>
            button.querySelector(".popover-glyph.on"),
          )
          check(
            checked.length === 1 && checked[0].querySelector(".popover-label")?.textContent === labels[mode],
            `${prefix}reopened menu marks only the selected mode`,
          )
          const usable = host.clientWidth - 38
          const sourceWidth = terminal.paneCols * terminal.cellWidth
          const scale = terminal.rowHeight / terminal.cellHeight
          check(
            terminal.fontSize === 14 &&
              Math.abs(scale - (mode === "shrink" ? Math.min(1, usable / sourceWidth) : 1)) < 0.000001,
            `${prefix}normal font and correct downscale`,
          )
          check(
            mode === "original"
              ? host.scrollWidth > host.clientWidth === sourceWidth > usable
              : host.scrollWidth <= host.clientWidth,
            `${prefix}correct horizontal scroll range`,
          )
          check(
            terminal.laidOut.length ===
              (mode === "wrap" ? Math.ceil(cols / Math.floor(usable / terminal.cellWidth)) : 1),
            `${prefix}correct rendered row count`,
          )
          evidence.push({
            width,
            cols,
            mode,
            host: host.clientWidth,
            scroll: host.scrollWidth,
            rows: terminal.laidOut.length,
            scale,
          })
          more.click()
        }
      }
    }
    await load()
    check(fitPreview.contentWindow.fitFixture.modes[0] === "shrink", "The selected fit mode survives a fixture reload")
    window.fitModeEvidence = evidence
    // Leave a real menu and wide content available for trusted browser clicks.
    await fitPreview.contentWindow.fitFixture.terminal.setContent("X".repeat(240), 39)
  }
  const headerPositions = new Map()
  const lines = []
  function check(condition, message) {
    if (!condition) throw new Error(message)
    lines.push(`PASS ${message}`)
  }
  try {
    for (const theme of ["dark", "light"]) {
      for (const width of [320, 390, 1024]) {
        for (const view of ["list", "detail", "login"]) {
          show(theme, width, view)
          await frame()
          check(doc.documentElement.scrollWidth <= width, `${theme} ${width}px ${view}: no page overflow`)
          if (view === "login") continue
          const prefix = view === "detail" ? "detail" : "list"
          const back = el(`${prefix}-back`)
          const more = el(`${prefix}-more`)
          const header = back.closest("header").getBoundingClientRect()
          check(
            back.offsetWidth === 50 && back.offsetHeight === 50 && more.offsetWidth === 60 && more.offsetHeight === 46,
            `${theme} ${width}px ${view}: original header touch targets`,
          )
          check(
            more.getBoundingClientRect().right <= header.right,
            `${theme} ${width}px ${view}: actions fit the header`,
          )
          check(
            style(back).webkitTapHighlightColor === "rgba(0, 0, 0, 0)" &&
              style(more).webkitTapHighlightColor === "rgba(0, 0, 0, 0)",
            `${theme} ${width}px ${view}: native rectangular tap overlay disabled`,
          )
          const controls = [...back.closest("header").querySelectorAll(".round-outline, .pill-button")]
          check(
            controls.every((button) => {
              const surface = style(button, "::before")
              return surface.width === "38px" && surface.height === "38px" && surface.borderRadius === "50%"
            }),
            `${theme} ${width}px ${view}: every header action has a 38px circular surface`,
          )
          const centers = controls.map((button) => {
            const box = button.getBoundingClientRect()
            return [box.x + box.width / 2, box.y + box.height / 2]
          })
          check(
            header.height === (width <= 760 ? 58 : 70) &&
              centers.every((point) => Math.abs(point[1] - header.y - header.height / 2) < 0.01),
            `${theme} ${width}px ${view}: fixed header height and common action centerline`,
          )
          const positionKey = `${theme}:${width}`
          if (view === "list") headerPositions.set(positionKey, { top: header.top, centers })
          else {
            const previous = headerPositions.get(positionKey)
            check(
              previous.top === header.top &&
                centers.every((point, index) =>
                  point.every((value, axis) => Math.abs(value - previous.centers[index][axis]) < 0.01),
                ),
              `${theme} ${width}px: list-to-detail header action coordinates remain identical`,
            )
          }
          if (view === "list") {
            const rows = [...el("session-list").querySelectorAll(".session-row")]
            const listBounds = el("session-list").getBoundingClientRect()
            for (const index of [0, 1, rows.length - 1]) {
              for (const [number, row] of rows.entries()) row.classList.toggle("selected", number === index)
              const selected = rows[index]
              const rowStyle = style(selected)
              const box = selected.getBoundingClientRect()
              check(
                rowStyle.borderRadius === "0px" &&
                  rowStyle.backgroundClip === "padding-box" &&
                  rowStyle.borderBottomWidth === "1px" &&
                  box.left === listBounds.left &&
                  box.right === listBounds.right,
                `${theme} ${width}px: selected row ${index + 1} stays straight and inside its separators`,
              )
            }
            for (const [index, row] of rows.entries()) row.classList.toggle("selected", index === 1)
          }
          const center = back.closest("header").querySelector(".app-bar-center").getBoundingClientRect()
          const actions = back.closest("header").querySelector(".app-bar-right, .pill-group").getBoundingClientRect()
          if (view === "list") {
            const title = doc.querySelector("#screen-list .app-bar-title").getBoundingClientRect()
            check(
              Math.abs(title.left - center.left) < 0.5,
              `${theme} ${width}px list: title and adjacent symbols align left`,
            )
            back.classList.add("hidden")
            const aligned = doc.querySelector("#screen-list .app-bar-title").getBoundingClientRect()
            check(
              Math.abs(aligned.left - header.left - 19) < 0.5 && aligned.right <= more.getBoundingClientRect().left,
              `${theme} ${width}px list: no-exit title starts at the left inset without overlapping actions`,
            )
            back.classList.remove("hidden")
          }
          check(
            center.left >= back.getBoundingClientRect().right && center.right <= actions.left,
            `${theme} ${width}px ${view}: header text does not overlap actions`,
          )
          const menu = el(`${view === "detail" ? "action" : "list"}-menu`)
          menu.classList.remove("hidden")
          await frame()
          const bounds = menu.getBoundingClientRect()
          check(
            bounds.top >= header.bottom && bounds.right <= header.right && bounds.left >= header.left,
            `${theme} ${width}px ${view}: menu stays below header and within page`,
          )
          check(menu.scrollWidth <= menu.clientWidth, `${theme} ${width}px ${view}: menu text fits`)
          const select = menu.querySelector("select")
          const control = select.closest(".appearance-control")
          const value = control.querySelector(".appearance-value")
          const valueStyle = style(value)
          const measure = doc.createElement("canvas").getContext("2d")
          measure.font = valueStyle.font
          check(
            control.offsetHeight >= 44 &&
              select.offsetHeight >= 44 &&
              valueStyle.fontSize === "14px" &&
              Number.parseFloat(style(control, "::before").height) === 36 &&
              value.clientWidth -
                Number.parseFloat(valueStyle.paddingLeft) -
                Number.parseFloat(valueStyle.paddingRight) >=
                measure.measureText("System").width,
            `${theme} ${width}px ${view}: Appearance text has space separate from its arrow`,
          )
          check(
            Number(style(menu.querySelector(":disabled")).opacity) < 1,
            `${theme} ${width}px ${view}: disabled actions remain distinct`,
          )
          select.focus()
          check(
            style(control, "::before").borderTopWidth === "1px" &&
              style(control, "::before").boxShadow === "none" &&
              style(select).color === "rgba(0, 0, 0, 0)" &&
              style(select).outlineStyle === "none",
            `${theme} ${width}px ${view}: Appearance uses one thin focus border`,
          )
          menu.classList.add("hidden")
          if (view === "detail") {
            const chips = [...el("key-chips").querySelectorAll("button")]
            check(
              chips.every((button) => button.offsetHeight >= 44 && style(button, "::before").height === "36px") &&
                chips
                  .filter((button) => !button.classList.contains("key-symbol"))
                  .every((button) => style(button).fontSize === "12px") &&
                [
                  ...chips.filter((button) => button.classList.contains("key-symbol")),
                  doc.querySelector(".keys-add"),
                ].every((button) => style(button).fontSize === "20px"),
              `${theme} ${width}px: compact shortcuts keep touch targets and larger symbols`,
            )
            const inputCard = doc.querySelector(".realtime-input").getBoundingClientRect()
            const toggle = el("keys-toggle").getBoundingClientRect()
            const send = el("command-send").getBoundingClientRect()
            check(
              toggle.right <= inputCard.left &&
                send.left >= inputCard.right &&
                toggle.height >= 44 &&
                send.height >= 44 &&
                el("input-mode").textContent === "" &&
                style(el("input-mode")).display === "none" &&
                el("command-input").getAttribute("aria-label").length > 0,
              `${theme} ${width}px: shortcuts toggle and Enter flank the single-line input`,
            )
            const extras = el("extra-keys")
            extras.classList.remove("hidden")
            await frame()
            check(
              extras.querySelector("legend") === null &&
                extras.getAttribute("aria-label").length > 0 &&
                extras.getBoundingClientRect().left >= 0 &&
                extras.getBoundingClientRect().right <= width &&
                extras.querySelector("label").getBoundingClientRect().top >= extras.getBoundingClientRect().top + 8,
              `${theme} ${width}px: extra keys have no visible title and stay inside their popover`,
            )
            extras.classList.add("hidden")
            el("command-input").focus()
            check(
              style(doc.querySelector(".realtime-input")).borderTopWidth === "1px" &&
                style(doc.querySelector(".realtime-input")).boxShadow === "none" &&
                doc.querySelector(".realtime-input").offsetHeight <= 46,
              `${theme} ${width}px: input card stays compact with one thin focus border`,
            )
          }
        }
      }
    }
    show("dark", 390, "detail")
    await frame()
    check(
      style(el("command-input")).fontSize === "16px" &&
        style(el("command-input")).transform === "matrix(0.875, 0, 0, 0.875, 0, 0)" &&
        el("command-input").getBoundingClientRect().width <=
          el("command-input").parentElement.getBoundingClientRect().width,
      "Phone input displays 14px text while retaining a 16px native field",
    )
    check(
      [...el("key-chips").querySelectorAll("button")].every((button) => button.offsetHeight >= 44),
      "Shortcut keys keep at least 44px touch height",
    )
    check(style(el("command-send")).width === style(el("command-send")).height, "Input action targets are circular")
    const disabled = el("command-send")
    disabled.disabled = true
    check(Number(style(disabled).opacity) < 1, "Disabled input action remains distinct")
    disabled.disabled = false
    show("dark", 390, "list")
    let creationState = { workspaces: [{ workspace_id: "w2", label: "Chosen workspace", number: 2 }] }
    let releaseCreate
    const creations = []
    const newMenu = new NewTerminalMenu(el("list-new"), el("new-terminal-menu"), {
      snapshot: () => creationState,
      beforeOpen: () => el("list-menu").classList.add("hidden"),
      create: async (agent, workspaceId) => {
        creations.push([agent.kind, workspaceId])
        await new Promise((resolve) => {
          releaseCreate = resolve
        })
      },
    })
    const menuLabels = () =>
      [...el("new-terminal-menu").querySelectorAll(".popover-label")].map((node) => node.textContent)
    const menuKey = (key) =>
      doc.activeElement.dispatchEvent(
        new preview.contentWindow.KeyboardEvent("keydown", { key, bubbles: true, cancelable: true }),
      )
    newMenu.update()
    el("list-menu").classList.remove("hidden")
    el("list-new").click()
    check(newMenu.isOpen() && el("list-menu").classList.contains("hidden"), "New Tab opens and closes the More menu")
    check(
      JSON.stringify(menuLabels()) === JSON.stringify(["Claude Code", "Codex", "pi"]),
      "New Tab offers the Alma agent choices",
    )
    const firstAgent = doc.activeElement
    newMenu.update()
    check(doc.activeElement === firstAgent, "State polling preserves menu focus and DOM nodes")
    menuKey("ArrowDown")
    doc.activeElement.click()
    check(
      newMenu.isOpen() && el("new-terminal-menu").textContent.includes("Start Codex in"),
      "Agent click keeps the workspace submenu open after bubbling",
    )
    check(
      JSON.stringify(menuLabels()) === JSON.stringify(["Back", "Chosen workspace"]),
      "Workspace submenu shows the target workspace",
    )
    await frame()
    const newBounds = el("new-terminal-menu").getBoundingClientRect()
    const listHeader = el("list-new").closest("header").getBoundingClientRect()
    check(
      newBounds.top >= listHeader.bottom && newBounds.right <= listHeader.right && newBounds.left >= listHeader.left,
      "New Tab submenu fits the phone header",
    )
    menuKey("Escape")
    check(newMenu.isOpen() && menuLabels()[0] === "Claude Code", "Escape returns from workspaces to agents")
    menuKey("Escape")
    check(!newMenu.isOpen() && doc.activeElement === el("list-new"), "Escape closes the agent menu and restores focus")
    el("list-new").click()
    doc.body.click()
    check(!newMenu.isOpen(), "Clicking outside closes New Tab")
    el("list-new").click()
    el("new-terminal-menu").querySelectorAll("button")[1].click()
    const workspaceButton = el("new-terminal-menu").querySelectorAll("button")[1]
    workspaceButton.click()
    workspaceButton.click()
    check(
      creations.length === 1 &&
        JSON.stringify(creations[0]) === JSON.stringify(["codex", "w2"]) &&
        el("list-new").disabled,
      "Workspace selection starts once and disables duplicate creation",
    )
    releaseCreate()
    await frame()
    check(!el("list-new").disabled, "Creation completion enables New Tab again")
    creationState = { workspaces: [] }
    newMenu.update()
    check(el("list-new").disabled && !newMenu.isOpen(), "An empty workspace list disables New Tab")
    const treeState = {
      workspaces: [
        { workspace_id: "w1", label: "e2e-check", tab_count: 2, agent_status: "working" },
        {
          workspace_id: "w2",
          label: "A workspace with a long title for truncation",
          tab_count: 1,
          agent_status: "idle",
        },
      ],
      tabs: [
        { tab_id: "t1", workspace_id: "w1", label: "1", agent_status: "working" },
        { tab_id: "t2", workspace_id: "w1", label: "relay-acceptance", agent_status: "blocked" },
        { tab_id: "t3", workspace_id: "w2", label: "A long tab label that must fit the sidebar", agent_status: "idle" },
      ],
      panes: [
        { pane_id: "p1", tab_id: "t1", title: "wB:p1", agent_status: "idle" },
        { pane_id: "p2", tab_id: "t1", terminal_title_stripped: "almaprobe echo", agent_status: "working" },
        { pane_id: "p3", tab_id: "t2", title: "wB:p3", agent_status: "blocked" },
        { pane_id: "p4", tab_id: "t3", title: "A very long pane title that must be truncated", agent_status: "idle" },
      ],
    }
    const picks = []
    const collapsedWorkspaces = new Set()
    const treeOptions = {
      snapshot: treeState,
      selectedPaneId: "p2",
      collapsedWorkspaces,
      onWorkspace: (id) => picks.push(["workspace", id]),
      onTab: (id) => picks.push(["tab", id]),
      onPane: (id) => picks.push(["pane", id]),
    }
    renderWorkspaceTree(el("tree"), treeOptions)
    check(
      JSON.stringify([...el("tree").querySelectorAll(".pane .label")].map((node) => node.textContent)) ===
        JSON.stringify(["wB:p1", "almaprobe echo", "wB:p3", "A very long pane title that must be truncated"]),
      "Workspace tree retains every pane title and backend order",
    )
    check(
      el("tree").querySelector(".pane .tree-kind") === null &&
        el("tree").querySelector(".pane").getAttribute("aria-label").startsWith("Pane:"),
      "Pane rows show only their title while retaining accessible type labels",
    )
    check(
      el("tree").querySelectorAll("section.tree-workspace").length === 2 &&
        el("tree").querySelector(".tree-tab .tree-panes").children.length === 2 &&
        el("tree").querySelector(".count").textContent === "2 tabs" &&
        el("tree").querySelector(".workspace").getAttribute("aria-label").includes("2 tabs"),
      "Workspace tree separates workspaces, tabs and split panes with a labelled count",
    )
    const workspaceSection = (id) => el("tree").querySelector(`[data-workspace="${id}"]`).closest(".tree-workspace")
    workspaceSection("w1").querySelector(".workspace-toggle").click()
    check(
      workspaceSection("w1").querySelector(".tree-tabs").classList.contains("hidden") &&
        workspaceSection("w1").querySelector(".workspace-toggle").getAttribute("aria-expanded") === "false" &&
        workspaceSection("w1").querySelector(".count").textContent === "2 tabs" &&
        !workspaceSection("w2").querySelector(".tree-tabs").classList.contains("hidden") &&
        picks.length === 0,
      "Collapsing a workspace keeps its heading, count and other workspaces without selecting a terminal",
    )
    workspaceSection("w2").querySelector(".workspace-toggle").click()
    renderWorkspaceTree(el("tree"), treeOptions)
    check(
      [...el("tree").querySelectorAll(".tree-tabs")].every((tabs) => tabs.classList.contains("hidden")) &&
        el("tree").querySelector('[data-pane="p2"]').getAttribute("aria-current") === "true",
      "Workspace folds and the selected pane survive a state redraw",
    )
    workspaceSection("w1").querySelector(".workspace-toggle").click()
    check(
      !workspaceSection("w1").querySelector(".tree-tabs").classList.contains("hidden") &&
        workspaceSection("w2").querySelector(".tree-tabs").classList.contains("hidden") &&
        workspaceSection("w1").querySelector(".workspace-toggle").getAttribute("aria-expanded") === "true",
      "Each workspace expands independently with an accessible state",
    )
    workspaceSection("w2").querySelector(".workspace").click()
    check(
      !workspaceSection("w2").querySelector(".tree-tabs").classList.contains("hidden") &&
        JSON.stringify(picks) === JSON.stringify([["workspace", "w2"]]),
      "Choosing a workspace name expands it and retains its original navigation action",
    )
    picks.length = 0
    const chosen = el("tree").querySelector('[data-pane="p2"]')
    check(
      chosen.getAttribute("aria-current") === "true" &&
        chosen.classList.contains("selected") &&
        chosen.getAttribute("aria-label").includes("working") &&
        chosen.querySelector(".dot").classList.contains("working"),
      "Workspace tree preserves the selection and status with accessible labels",
    )
    for (const selector of [".workspace", ".tab", '[data-pane="p2"]']) el("tree").querySelector(selector).click()
    check(
      JSON.stringify(picks) ===
        JSON.stringify([
          ["workspace", "w1"],
          ["tab", "t1"],
          ["pane", "p2"],
        ]),
      "Workspace, tab and pane buttons each invoke only their original selection action",
    )
    for (const theme of ["dark", "light"]) {
      for (const width of [320, 390, 1024]) {
        show(theme, width, "detail")
        el("sidebar").classList.add("open")
        await frame()
        const sharing = el("desktop-sharing")
        sharing.showModal()
        await frame()
        const sharingBounds = sharing.getBoundingClientRect()
        check(
          el("sidebar").querySelector("#remote-panel, #remote-details") === null &&
            sharingBounds.left >= 12 &&
            sharingBounds.right <= width - 12 &&
            sharingBounds.top >= 0 &&
            sharingBounds.bottom <= preview.height &&
            sharing.scrollWidth <= sharing.clientWidth &&
            el("desktop-sharing-close").offsetHeight >= 44,
          `${theme} ${width}px: desktop sharing stays in a bounded dialog outside the workspace sidebar`,
        )
        const relayState = el("relay-state")
        relayState.textContent = "Relay unavailable: ".repeat(30)
        const relayColor = style(relayState).color
        relayState.classList.add("error")
        check(
          style(relayState).fontSize === "11px" &&
            style(relayState).color !== relayColor &&
            style(relayState).wordBreak === "break-word" &&
            sharing.scrollWidth <= sharing.clientWidth,
          `${theme} ${width}px: relay errors keep the error color and wrap inside the sharing dialog`,
        )
        relayState.textContent = ""
        relayState.classList.remove("error")
        sharing.close()
        check(
          [...el("tree").querySelectorAll(".tree-workspace")].every((workspace) => {
            const icon = workspace.querySelector(".workspace-toggle svg").getBoundingClientRect()
            return [...workspace.querySelectorAll(".tab .dot, .pane .dot")].every((dot) => {
              const bounds = dot.getBoundingClientRect()
              return Math.abs(icon.left + icon.width / 2 - bounds.left - bounds.width / 2) < 0.5
            })
          }),
          `${theme} ${width}px tree: workspace toggle icons align with tab and pane status dots`,
        )
        const rows = [...el("tree").querySelectorAll("button")]
        check(
          rows.every((button) => button.offsetHeight >= 44) && el("tree").scrollWidth <= el("tree").clientWidth,
          `${theme} ${width}px tree: all rows keep touch targets and fit the sidebar`,
        )
        check(
          Number.parseFloat(style(chosen).fontSize) >
            Number.parseFloat(style(el("tree").querySelector(".tab")).fontSize) &&
            style(chosen).boxShadow === "none" &&
            style(chosen).borderRadius === "4px" &&
            style(chosen).borderLeftWidth === "0px" &&
            style(chosen).backgroundColor !== "rgba(0, 0, 0, 0)",
          `${theme} ${width}px tree: selection has a subtle 4px radius with no accent rail or shadow`,
        )
        check(
          style(el("tree").querySelector(".tree-tabs")).borderLeftWidth === "1px" &&
            style(el("tree").querySelector(".tree-panes")).borderLeftWidth === "1px" &&
            [...el("tree").querySelectorAll(".label")].every(
              (label) =>
                style(label).textOverflow === "ellipsis" &&
                label.getBoundingClientRect().right <= el("sidebar").getBoundingClientRect().right,
            ),
          `${theme} ${width}px tree: hierarchy guides and long title truncation stay within bounds`,
        )
        check(
          [...el("tree").querySelectorAll(".tree-panes")].every((group) => {
            const guide = style(group, "::before")
            return (
              guide.top === "4px" &&
              guide.bottom === "4px" &&
              guide.borderLeftWidth === "1px" &&
              guide.pointerEvents === "none" &&
              group.querySelector(".pane").getBoundingClientRect().left - group.getBoundingClientRect().left === 1
            )
          }),
          `${theme} ${width}px tree: guides stop 4px before the corners without adding a side gap`,
        )
        const group = chosen.closest(".tree-panes")
        const peer = group.querySelector(".pane:not(.selected)")
        check(
          chosen.getBoundingClientRect().left === group.getBoundingClientRect().left &&
            chosen.getBoundingClientRect().right === peer.getBoundingClientRect().right &&
            chosen.querySelector(".tree-copy").getBoundingClientRect().left ===
              peer.querySelector(".tree-copy").getBoundingClientRect().left &&
            style(chosen).position === "relative" &&
            style(chosen).backgroundImage.includes("linear-gradient"),
          `${theme} ${width}px tree: selection covers the guide without moving its text or right edge`,
        )
        el("tree").scrollTop = el("tree").scrollHeight
        check(
          el("tree").querySelector('[data-pane="p4"]').getBoundingClientRect().bottom <=
            el("tree").getBoundingClientRect().bottom + 1,
          `${theme} ${width}px tree: the final pane can be reached by scrolling`,
        )
        el("tree").scrollTop = 0
        el("sidebar").classList.remove("open")
      }
    }
    const emptyList = doc.createElement("div")
    renderSessionList(emptyList, { snapshot: { workspaces: [], panes: [] }, selectedPaneId: null, onPick() {} })
    check(emptyList.textContent.includes("on your computer"), "No workspaces guides setup on the desktop")
    renderSessionList(emptyList, {
      snapshot: { workspaces: [{ workspace_id: "w1" }], panes: [] },
      selectedPaneId: null,
      onPick() {},
    })
    check(emptyList.textContent.includes("Use +"), "An existing empty workspace points to the supported New Tab menu")
    const creationNotice = el("new-tab-status")
    creationNotice.textContent = "Tab created; pi could not start: executable not found"
    creationNotice.classList.remove("hidden")
    creationNotice.classList.add("error")
    for (const view of ["list", "detail"]) {
      show("dark", 390, view)
      await frame()
      check(
        creationNotice.getBoundingClientRect().height > 0 &&
          creationNotice.getBoundingClientRect().width <= preview.width,
        `New Tab failure remains visible in the ${view} screen`,
      )
    }
    creationNotice.textContent = ""
    creationNotice.classList.add("hidden")
    creationNotice.classList.remove("error")
    check(
      el("list-new") !== null && doc.querySelector("#new-workspace, #new-tab, .sidebar-actions") === null,
      "Only the supported New Tab menu remains; desktop workspace creation has no Web entry",
    )
    show("dark", 390, "detail")
    el("detail-back").focus()
    await checkFitModes()
    document.title = "PASS: UI details"
    lines.push("ALL CHECKS PASSED")
  } catch (error) {
    lines.push(`FAIL ${error.message}`)
    document.title = "FAIL: UI details"
  }
  results.textContent = lines.join("\n")
  doc.addEventListener("keyup", (event) => {
    if (event.key !== "Tab" || !event.isTrusted) return
    const target = doc.activeElement
    document.querySelector("#focus-state").textContent = JSON.stringify({
      target: target.id,
      documentFocused: doc.hasFocus(),
      focusVisible: target.matches(":focus-visible"),
      outline: style(target).outlineStyle,
      width: style(target).outlineWidth,
    })
  })
  function update() {
    show(
      document.querySelector("#theme").value,
      Number(document.querySelector("#width").value),
      document.querySelector("#view").value,
    )
  }
  for (const id of ["theme", "width", "view"]) document.querySelector(`#${id}`).addEventListener("change", update)
  document.querySelector("#menu").addEventListener("click", () => {
    el(document.querySelector("#view").value === "list" ? "list-menu" : "action-menu").classList.toggle("hidden")
  })
  update()
  </script>
</html>
