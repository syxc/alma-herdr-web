<!doctype html>
<meta charset="utf-8">
<title>Page activity checks</title>
<style>
body {
  font: 15px system-ui;
  margin: 20px;
  background: #f8fafc;
  color: #1a1a1a;
}
iframe {
  width: 390px;
  height: 560px;
  border: 1px solid #c9cdd3;
}
pre {
  white-space: pre-wrap;
  line-height: 1.6;
}
</style>
<h1>Page activity checks</h1>
<p>Isolated mock connection; visibility events are controlled by this fixture.</p>
<iframe title="Test app" src="/?clean=1"></iframe>
<pre id="result">Running…</pre>
<script type="module">
const pairing = "__TEST_PAIRING__"
const frame = document.querySelector("iframe")
const result = document.querySelector("#result")
const pause = (ms) => new Promise((resolve) => setTimeout(resolve, ms))
const stats = async () => (await fetch("/check/stats")).json()
const lines = []
function check(value, message) {
  if (!value) throw new Error(message)
  lines.push(`PASS ${message}`)
  result.textContent = lines.join("\n")
}
async function until(predicate, timeout = 15000) {
  const deadline = Date.now() + timeout
  while (!(await predicate())) {
    if (Date.now() >= deadline) throw new Error("Timed out waiting for app state")
    await pause(40)
  }
}
try {
  // The list is visible in the static HTML before main.ts binds the controls.
  await until(() => frame.contentDocument?.querySelector("#pair-panel")?.classList.contains("hidden") === false)
  let doc = frame.contentDocument
  let visibility = "visible"
  function setVisibility(value) {
    visibility = value
    doc.dispatchEvent(new Event("visibilitychange"))
  }
  Object.defineProperty(doc, "visibilityState", { configurable: true, get: () => visibility })
  doc.querySelector("#pair-input").value = pairing
  doc.querySelector("#pair-input").dispatchEvent(new Event("input"))
  doc.querySelector("#pair-apply").click()
  await until(
    () =>
      doc.querySelector("#connection").classList.contains("online") &&
      doc.querySelector("#remote-banner").classList.contains("hidden"),
  )
  check(doc.querySelector("#statusbar").textContent === "", "Connected state leaves no duplicate footer message")
  check(
    doc.querySelector("#sidebar #remote-panel") === null,
    "Paired desktop navigation has no local relay setup panel",
  )
  doc.querySelector("#list-more").click()
  check(
    !doc.querySelector("#list-menu").textContent.includes("Share this desktop"),
    "Static paired clients do not offer local desktop sharing",
  )
  check(
    doc.querySelector("#list-menu .connection-info").textContent.includes("Encrypted session"),
    "List menu keeps connection details available",
  )
  doc.querySelector("#list-more").click()
  const paired = await stats()
  await pause(3200)
  const list = await stats()
  check(
    list.stateReads > paired.stateReads && list.paneReads === paired.paneReads,
    "List refreshes state without reading terminal snapshots",
  )
  doc.querySelector('.session-row[data-pane="w1:p1"]').click()
  await until(async () => (await stats()).paneReads > 0)
  check(!doc.querySelector("#screen-detail").classList.contains("hidden"), "Opening a pane starts terminal reads")
  doc.querySelector("#detail-more").click()
  check(
    doc.querySelector("#action-menu .connection-info").textContent.includes("Encrypted session"),
    "Detail menu keeps connection details available",
  )
  const appearance = doc.querySelector("#action-menu [data-appearance-select]")
  const canvas = doc.querySelector("#terminal")
  const pixel = () => {
    const ratio = frame.contentWindow.devicePixelRatio
    return [...canvas.getContext("2d").getImageData(Math.floor(25 * ratio), Math.floor(19 * ratio), 1, 1).data]
      .slice(0, 3)
      .join(",")
  }
  for (const choice of ["light", "dark", "system"]) {
    appearance.value = choice
    appearance.dispatchEvent(new Event("change", { bubbles: true }))
    const theme =
      choice === "system"
        ? frame.contentWindow.matchMedia("(prefers-color-scheme: dark)").matches
          ? "dark"
          : "light"
        : choice
    const expected = theme === "dark" ? "45,49,58" : "240,240,240"
    await until(() => doc.documentElement.dataset.theme === theme && pixel() === expected)
    check(true, `${choice}: Appearance menu switches page and fixed RGB terminal surfaces together`)
  }
  doc.querySelector("#detail-more").click()
  setVisibility("hidden")
  await pause(200)
  const hidden = await stats()
  await pause(3200)
  const idle = await stats()
  check(
    idle.stateReads === hidden.stateReads && idle.paneReads === hidden.paneReads,
    "Hidden page starts no state or terminal polls",
  )
  check(
    idle.connections === hidden.connections && idle.connections > 0,
    "Background pause keeps the encrypted connection open",
  )
  setVisibility("visible")
  await until(async () => {
    const next = await stats()
    return next.stateReads > idle.stateReads && next.paneReads > idle.paneReads
  })
  check(true, "Returning to the foreground refreshes state and terminal output")
  doc.querySelector("#detail-back").click()
  await pause(200)
  const returned = await stats()
  await pause(3200)
  const after = await stats()
  check(
    after.stateReads > returned.stateReads && after.paneReads === returned.paneReads,
    "Returning to the list stops terminal reads while state stays live",
  )
  const beforeReload = await stats()
  frame.contentWindow.location.reload()
  await until(
    () =>
      frame.contentDocument !== doc &&
      frame.contentDocument?.querySelector("#screen-detail")?.classList.contains("hidden") === false,
  )
  doc = frame.contentDocument
  await until(async () => (await stats()).paneReads > beforeReload.paneReads)
  check(true, "Reload restores the paired pane and reads it after showing the detail view")
  Object.defineProperty(doc, "visibilityState", { configurable: true, get: () => visibility })
  setVisibility("visible")
  for (const fault of ["drop", "pause"]) {
    const previousOutput = doc.querySelector("#terminal-view").textContent
    await fetch(`/check/${fault}`, { method: "POST" })
    try {
      await until(() => doc.querySelector("#connection").textContent === "reconnecting", 25000)
      check(
        !doc.querySelector("#screen-detail").classList.contains("hidden") &&
          doc.querySelector("#terminal-view").textContent.includes("recovery-check") &&
          doc.querySelector("#remote-banner").textContent.includes("Reconnecting"),
        `${fault}: connection failure keeps the terminal visible and offers automatic recovery`,
      )
    } finally {
      if (fault === "pause") await fetch("/check/resume", { method: "POST" })
    }
    await until(
      () =>
        doc.querySelector("#connection").classList.contains("online") &&
        doc.querySelector("#remote-banner").classList.contains("hidden") &&
        doc.querySelector("#terminal-view").textContent.includes("recovery-check") &&
        doc.querySelector("#terminal-view").textContent !== previousOutput,
    )
    check(true, `${fault}: automatic reconnect resumes new output in the original terminal without pairing again`)
  }
  result.textContent += "\n\nALL CHECKS PASSED"
  document.title = "PASS — Page activity checks"
} catch (error) {
  result.textContent += `\n\nFAIL ${error.message}`
  document.title = "FAIL — Page activity checks"
}
</script>
