<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Terminal input checks</title>
    <style>
    body {
      max-width: 760px;
      margin: 24px auto;
      padding: 0 16px;
      font: 15px system-ui;
      color: #1a1a1a;
    }
    input {
      width: min(90%, 500px);
      padding: 8px;
      font: 16px monospace;
    }
    canvas {
      display: block;
      width: 200px;
      height: 30px;
      border: 1px solid #aaa;
    }
    pre {
      white-space: pre-wrap;
    }
    #fixtures {
      display: none;
    }
    </style>
  </head>
  <body>
    <h1>Terminal input checks</h1>
    <p>
      Real DOM controls with an isolated key sink. Composition events are controlled; this does not test a phone IME.
    </p>
    <pre id="results">Running…</pre>
    <div id="fixtures"></div>
    <label>Manual input <input id="manual" autocomplete="off"></label>
    <canvas id="screen" tabindex="0" aria-label="Manual terminal keys"></canvas>
    <pre id="manual-state"></pre>
    <script type="module">
    import { TerminalInput } from "/dist/input.js"
    import { KeyToolbar } from "/dist/key-toolbar.js"

    const results = document.querySelector("#results")
    const fixtures = document.querySelector("#fixtures")
    const lines = []
    const settle = () => new Promise((resolve) => setTimeout(resolve, 40))
    function equal(actual, expected) {
      if (JSON.stringify(actual) !== JSON.stringify(expected)) {
        throw new Error(JSON.stringify({ actual, expected }))
      }
    }
    function press(target, key, options = {}) {
      const event = new KeyboardEvent("keydown", { key, cancelable: true, bubbles: true, ...options })
      target.dispatchEvent(event)
      return event
    }
    function fixture() {
      const field = document.createElement("input")
      const canvas = document.createElement("canvas")
      fixtures.append(field, canvas)
      const sent = []
      const input = new TerminalInput(field, canvas, {
        sendText: (text) => sent.push(["text", text]),
        sendKeys: (keys) => sent.push(["keys", keys]),
      })
      input.setEnabled(true)
      return { field, canvas, sent, input }
    }
    async function check(name, run) {
      try {
        await run(fixture())
        lines.push(`PASS ${name}`)
      } catch (error) {
        lines.push(`FAIL ${name}: ${error.message}`)
      }
      results.textContent = lines.join("\n")
    }
    await check("Unicode backspace and DOM caret", async ({ input, field, sent }) => {
      input.type("a😀")
      press(field, "Backspace")
      equal([field.value, field.selectionStart, field.selectionEnd], ["a", 1, 1])
      await settle()
      equal(sent, [
        ["text", "a😀"],
        ["keys", ["backspace"]],
      ])
    })
    await check("Unicode arrows, chip arrows and pointer movement", async ({ input, field, sent }) => {
      input.type("a😀b")
      press(field, "ArrowLeft")
      input.sendSpecial(["left"])
      equal(field.selectionStart, 1)
      field.setSelectionRange(4, 4)
      field.dispatchEvent(new MouseEvent("click"))
      await settle()
      equal(sent, [
        ["text", "a😀b"],
        ["keys", ["left", "left", "right", "right"]],
      ])
    })
    await check("Middle edit restores the browser caret", async ({ input, field }) => {
      input.type("abcd")
      press(field, "ArrowLeft")
      press(field, "ArrowLeft")
      press(field, "Backspace")
      equal([field.value, field.selectionStart], ["acd", 1])
      input.type("X")
      equal([field.value, field.selectionStart], ["aXcd", 2])
    })
    await check("Ctrl+U and Ctrl+W keep the caret before the suffix", async ({ input, field }) => {
      input.type("one two tail")
      press(field, "ArrowLeft", { ctrlKey: true })
      press(field, "w", { ctrlKey: true })
      equal([field.value, field.selectionStart], ["one tail", 4])
      press(field, "u", { ctrlKey: true })
      equal([field.value, field.selectionStart], ["tail", 0])
    })
    await check("Cmd shortcuts stay in the browser", async ({ field, sent }) => {
      for (const key of ["Enter", "Tab", "Backspace", "ArrowLeft", "ArrowRight", "Home", "End"]) {
        equal(press(field, key, { metaKey: true }).defaultPrevented, false)
      }
      await settle()
      equal(sent, [])
    })
    await check("Cmd navigation synchronizes before the next edit", async ({ input, field, sent }) => {
      input.type("abcd")
      press(field, "ArrowLeft", { metaKey: true })
      field.setSelectionRange(0, 0)
      press(field, "Backspace")
      equal([field.value, field.selectionStart], ["abcd", 0])
      await settle()
      equal(sent, [
        ["text", "abcd"],
        ["keys", ["left", "left", "left", "left", "backspace"]],
      ])
    })
    await check("Selected text replacement preserves the remote suffix and caret", async ({ input, field, sent }) => {
      input.type("abcd")
      field.setSelectionRange(1, 2)
      field.dispatchEvent(new MouseEvent("click"))
      field.value = "aXcd"
      field.setSelectionRange(2, 2)
      field.dispatchEvent(new InputEvent("input", { data: "X" }))
      await settle()
      equal(sent, [
        ["text", "abcd"],
        ["keys", ["left", "left", "left", "backspace", "ctrl+k"]],
        ["text", "aXcd"],
        ["keys", ["left", "left"]],
      ])
    })
    for (const direction of ["ArrowLeft", "ArrowRight"]) {
      await check(`Selected Unicode text collapses for ${direction}`, async ({ input, field, sent }) => {
        input.type("ab😀cd")
        field.setSelectionRange(0, 6)
        field.dispatchEvent(new KeyboardEvent("keyup"))
        press(field, direction)
        equal([field.selectionStart, field.selectionEnd], direction === "ArrowLeft" ? [0, 0] : [6, 6])
        await settle()
        const moves = new Array(5).fill("left")
        if (direction === "ArrowRight") moves.push(...new Array(5).fill("right"))
        equal(sent, [
          ["text", "ab😀cd"],
          ["keys", moves],
        ])
      })
    }
    await check("IME commits without a final non-composing input event", async ({ field, sent }) => {
      field.dispatchEvent(new CompositionEvent("compositionstart"))
      field.value = "我问问"
      field.dispatchEvent(new InputEvent("input", { data: "我问问", isComposing: true }))
      await settle()
      equal(sent, [])
      field.dispatchEvent(new CompositionEvent("compositionend", { data: "我问问" }))
      await settle()
      equal(sent, [["text", "我问问"]])
      field.dispatchEvent(new InputEvent("input", { data: "我问问", isComposing: false }))
      await settle()
      equal(sent, [["text", "我问问"]])
      press(field, "Enter")
      await settle()
      equal(sent, [
        ["text", "我问问"],
        ["keys", ["enter"]],
      ])
    })
    for (const endFirst of [false, true]) {
      await check(
        `Controlled IME confirmation: compositionend ${endFirst ? "before" : "after"} keydown`,
        async ({ field, canvas, sent }) => {
          field.dispatchEvent(new CompositionEvent("compositionstart"))
          field.value = "中"
          field.dispatchEvent(new InputEvent("input", { data: "中", isComposing: true }))
          await settle()
          equal(sent, [])
          if (endFirst) field.dispatchEvent(new CompositionEvent("compositionend", { data: "中" }))
          equal(press(field, "Enter", { isComposing: !endFirst, keyCode: 229 }).defaultPrevented, false)
          equal(press(canvas, "Enter", { isComposing: !endFirst, keyCode: 229 }).defaultPrevented, false)
          if (!endFirst) field.dispatchEvent(new CompositionEvent("compositionend", { data: "中" }))
          field.dispatchEvent(new InputEvent("input", { data: "中", isComposing: false }))
          await settle()
          equal(sent, [["text", "中"]])
          press(field, "Enter")
          await settle()
          equal(sent, [
            ["text", "中"],
            ["keys", ["enter"]],
          ])
        },
      )
    }
    const savedExtras = localStorage.getItem("alma-herdr-web:extra-keys")
    function toolbar(f, restore = false) {
      if (!restore) localStorage.removeItem("alma-herdr-web:extra-keys")
      const row = document.createElement("div")
      const menu = document.createElement("fieldset")
      const mode = document.createElement("span")
      menu.id = "test-extra-keys"
      const errors = []
      fixtures.append(row, menu, mode)
      const keys = new KeyToolbar(row, menu, mode, f.input, f.field, f.canvas, (message) => errors.push(message))
      keys.setEnabled(true)
      return {
        keys,
        row,
        menu,
        choose: (...labels) => {
          for (const label of labels) {
            const control = [...menu.querySelectorAll("label")]
              .find((item) => item.dataset.keyLabel === label)
              ?.querySelector("input")
            if (!control) throw new Error(`Missing optional key: ${label}`)
            if (!control.checked) control.click()
          }
        },
        mode,
        errors,
        button: (label) =>
          [...row.querySelectorAll("button"), row.nextElementSibling].find((item) => item.textContent === label),
      }
    }
    async function withClipboard(readText, run) {
      const original = Object.getOwnPropertyDescriptor(navigator, "clipboard")
      Object.defineProperty(navigator, "clipboard", { configurable: true, value: { readText } })
      try {
        await run()
      } finally {
        if (original) Object.defineProperty(navigator, "clipboard", original)
        else delete navigator.clipboard
      }
    }
    await check("Preset edit chips update the input and remote keys together", async (f) => {
      const ui = toolbar(f)
      ui.choose("Ctrl+W", "⌫", "Enter")
      f.input.type("one two")
      ui.button("Ctrl+W").click()
      equal([f.field.value, f.field.selectionStart], ["one ", 4])
      ui.button("⌫").click()
      equal(f.field.value, "one")
      ui.button("Enter").click()
      equal(f.field.value, "")
      await settle()
      equal(f.sent, [
        ["text", "one two"],
        ["keys", ["ctrl+w", "backspace", "enter"]],
      ])
    })
    await check("Ctrl is used once and then releases", async (f) => {
      const ui = toolbar(f)
      ui.choose("Ctrl")
      f.input.type("abcd")
      ui.button("Ctrl").click()
      equal(ui.button("Ctrl").getAttribute("aria-pressed"), "true")
      equal(press(f.field, "a").defaultPrevented, true)
      equal(f.field.selectionStart, 0)
      equal(ui.button("Ctrl").getAttribute("aria-pressed"), "false")
      f.input.type("X")
      await settle()
      equal(f.sent, [
        ["text", "abcd"],
        ["keys", ["ctrl+a"]],
        ["text", "X"],
      ])
    })
    await check("Modifier chips keep combined arrow modifiers", async (f) => {
      const ui = toolbar(f)
      ui.choose("Ctrl", "Alt", "Shift", "←")
      f.input.type("one two")
      for (const label of ["Ctrl", "Alt", "Shift"]) ui.button(label).click()
      ui.button("←").click()
      equal(f.field.selectionStart, 4)
      await settle()
      equal(f.sent, [
        ["text", "one two"],
        ["keys", ["ctrl+alt+shift+left"]],
      ])
    })
    await check("Shift transforms virtual text input once", async (f) => {
      const ui = toolbar(f)
      ui.choose("Shift")
      ui.button("Shift").click()
      const event = new InputEvent("beforeinput", { data: "x", inputType: "insertText", cancelable: true })
      f.field.dispatchEvent(event)
      equal(event.defaultPrevented, true)
      equal(f.field.value, "X")
      equal(ui.mode.textContent, "")
      await settle()
      equal(f.sent, [["text", "X"]])
    })
    await check("Clipboard paste replaces the selected text", async (f) => {
      const ui = toolbar(f)
      f.input.type("abcd")
      f.field.setSelectionRange(1, 2)
      await withClipboard(
        async () => "X",
        async () => {
          ui.button("Paste").click()
          await settle()
        },
      )
      equal([f.field.value, f.field.selectionStart], ["aXcd", 2])
      equal(ui.errors, [])
    })
    await check("Denied clipboard access gives a native paste fallback", async (f) => {
      const ui = toolbar(f)
      await withClipboard(
        async () => {
          throw new DOMException("Denied", "NotAllowedError")
        },
        async () => {
          ui.button("Paste").click()
          await settle()
        },
      )
      equal(ui.errors, ["Clipboard unavailable. Long-press the input field to paste."])
      equal(f.sent, [])
    })
    await check("Pending clipboard reads cannot reach a newly selected pane", async (f) => {
      const ui = toolbar(f)
      let finish
      await withClipboard(
        () =>
          new Promise((resolve) => {
            finish = resolve
          }),
        async () => {
          ui.button("Paste").click()
          ui.keys.reset()
          f.input.reset()
          f.input.type("new pane")
          finish("old clipboard")
          await settle()
        },
      )
      equal(f.field.value, "new pane")
      equal(f.sent, [["text", "new pane"]])
    })
    await check("The bottom Enter action releases pending modifiers", async (f) => {
      const ui = toolbar(f)
      ui.choose("Ctrl")
      ui.button("Ctrl").click()
      ui.keys.submit()
      equal(ui.button("Ctrl").getAttribute("aria-pressed"), "false")
      equal(press(f.field, "c").defaultPrevented, false)
      f.input.type("c")
      await settle()
      equal(f.sent, [
        ["keys", ["enter"]],
        ["text", "c"],
      ])
    })
    await check("Shift transforms punctuation in the shortcut and virtual keyboard", async (f) => {
      const ui = toolbar(f)
      ui.choose("Shift", String.fromCharCode(96))
      ui.button("Shift").click()
      ui.button(String.fromCharCode(96)).click()
      ui.button("Shift").click()
      press(f.field, "1")
      equal(f.field.value, "~!")
      await settle()
      equal(f.sent, [["text", "~!"]])
    })
    await check("Default shortcuts stay focused and the add button stays outside the scroller", async (f) => {
      const ui = toolbar(f)
      equal(
        [...ui.row.querySelectorAll("button")].map((item) => item.textContent),
        ["Tab", "Esc", "Paste", "Shift+Tab", "↑", "↓", "Ctrl+C"],
      )
      equal(ui.button("+").parentElement === ui.row.parentElement, true)
      equal(ui.row.contains(ui.button("+")), false)
      ui.keys.closeMenu()
      equal(ui.button("+").getAttribute("aria-expanded"), "false")
      ui.button("+").click()
      equal(ui.menu.classList.contains("hidden"), false)
      equal(ui.button("+").getAttribute("aria-expanded"), "true")
      ui.choose("Ctrl+A")
      equal(ui.button("+").getAttribute("aria-expanded"), "true")
      ui.keys.closeMenu()
      equal(ui.menu.classList.contains("hidden"), true)
      equal(ui.button("+").getAttribute("aria-expanded"), "false")
    })
    await check("Promoted Shift+Tab stays unique and sends its supported key", async (f) => {
      localStorage.setItem("alma-herdr-web:extra-keys", JSON.stringify(["shift+tab", "ctrl+a"]))
      const ui = toolbar(f, true)
      equal([...ui.row.querySelectorAll("button")].filter((item) => item.textContent === "Shift+Tab").length, 1)
      equal(Boolean(ui.button("Ctrl+A")), true)
      ui.button("Shift+Tab").click()
      await settle()
      equal(f.sent, [["keys", ["shift+tab"]]])
    })
    await check("Optional keys persist and removing a modifier releases its state", async (f) => {
      const ui = toolbar(f)
      ui.choose("Ctrl+A", "Ctrl")
      ui.button("Ctrl").click()
      const control = [...ui.menu.querySelectorAll("input")].find((item) => item.value === "ctrl")
      control.click()
      equal(ui.mode.textContent, "")
      equal(ui.button("Ctrl"), undefined)
      const restored = toolbar(fixture(), true)
      equal(Boolean(restored.button("Ctrl+A")), true)
      equal(restored.button("Ctrl"), undefined)
    })
    if (savedExtras === null) localStorage.removeItem("alma-herdr-web:extra-keys")
    else localStorage.setItem("alma-herdr-web:extra-keys", savedExtras)
    document.title = lines.some((line) => line.startsWith("FAIL")) ? "FAIL: Terminal input" : "PASS: Terminal input"
    results.textContent += `\n${document.title.startsWith("PASS") ? "ALL CHECKS PASSED" : "CHECKS FAILED"}`
    const field = document.querySelector("#manual")
    const log = document.querySelector("#manual-state")
    const sent = []
    function show() {
      log.textContent = JSON.stringify({ value: field.value, caret: field.selectionStart, sent }, null, 2)
    }
    const input = new TerminalInput(field, document.querySelector("#screen"), {
      sendText: (text) => {
        sent.push(["text", text])
        show()
      },
      sendKeys: (keys) => {
        sent.push(["keys", keys])
        show()
      },
    })
    input.setEnabled(true)
    </script>
  </body>
</html>
